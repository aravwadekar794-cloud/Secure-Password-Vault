spring.application.name=Backend

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/passwordmanagerdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin123}

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port (Render dynamic port support)
server.port=${PORT:8080}

# Disable H2 console (not needed for PostgreSQL)
spring.h2.console.enabled=false

# CORS Configuration (supports local development and Vercel domains)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}

# Cookie security settings (set COOKIE_SECURE=true and COOKIE_SAME_SITE=None in production for cross-site cookies)
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:Lax}


